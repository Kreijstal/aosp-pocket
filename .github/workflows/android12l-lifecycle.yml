name: Android 12L lifecycle

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ce162-lifecycle:
    name: CE162 full lifecycle gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test lifecycle gate and crash rejection
        run: python3 -m unittest discover -s tools/tests -p 'test_android12l_lifecycle_gate.py'
      - name: Require complete passing lifecycle evidence and Binder fix
        run: python3 tools/check_android12l_lifecycle.py
